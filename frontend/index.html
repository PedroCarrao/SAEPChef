<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAEPChef - Registro de Receita</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Drawer Perfil do Chef (Menu Lateral) -->
  <aside id="drawer-chef" class="drawer">
    <div class="drawer-header">
      <h2>Perfil do Chef</h2>
      <button id="btn-fechar-drawer" class="btn-fechar">×</button>
    </div>
    <div class="estatisticas-chef">
      <p id="total-favoritos-chef">0 Favoritos</p>
      <p id="total-receitas-chef">0 Receitas</p>
    </div>
    <button class="btn-suas-receitas">Suas receitas</button>
    <div id="lista-suas-receitas" class="lista-suas-receitas"></div>
  </aside>

  <!-- Cabeçalho -->
  <header>
    <div class="secao-usuario">
      <img id="img-perfil-header" src="assets/images/chef1.jpg" alt="Perfil" class="foto-perfil">
      <div>
        <span id="nome-usuario-header" class="nome-usuario">@SAEPChef</span>
        <button id="btn-ver-perfil" class="btn-perfil" disabled>Ver Perfil</button>
      </div>
    </div>

    <div class="secao-empresa">
      <h1>SAEPChef</h1>
    </div>

    <div class="secao-login">
      <button id="btn-login-header" class="btn-login">Login</button>
    </div>
  </header>

  <!-- Campo de Busca Centralizado -->
  <div class="container-busca">
    <form id="form-busca" class="form-busca">
      <input type="text" id="input-busca" class="input-busca" placeholder="Digite o nome do chef... ex: chef1">
      <button type="submit" class="btn-buscar">Buscar</button>
    </form>
    <div id="erro-busca" class="mensagem-erro"></div>
  </div>

  <!-- Conteúdo Principal -->
  <main>
    <!-- Área de Cadastro de Receita (Visível para o Chef logado) -->
    <section id="secao-cadastro-receita" class="secao-cadastro-receita">
      <h2>Cadastrar Nova Receita</h2>
      <form id="form-cadastro-receita" class="form-cadastro">
        <div class="campo-form">
          <label for="input-titulo-receita">Título da Receita</label>
          <input type="text" id="input-titulo-receita" placeholder="ex.: Risoto de Funghi">
        </div>
        <div class="campo-form">
          <label for="input-origem-receita">Origem da receita</label>
          <input type="text" id="input-origem-receita" placeholder="ex.: Itália">
        </div>
        <div class="campo-form campo-full">
          <label for="input-imagem-receita">Imagem</label>
          <input type="file" id="input-imagem-receita" accept="image/*">
        </div>
        <div class="campo-full">
          <button type="submit" class="btn-submeter" style="width: 100%;">Cadastrar</button>
        </div>
      </form>
    </section>

    <!-- Mural Grid de Receitas -->
    <section id="grid-receitas" class="grid-receitas"></section>
  </main>

  <!-- Modal de Login -->
  <div id="modal-login" class="modal">
    <div class="conteudo-modal">
      <button id="btn-fechar-modal" class="btn-fechar">×</button>
      <h2>Login</h2>
      <form id="form-login">
        <div class="campo-form">
          <label for="input-email">E-mail</label>
          <input type="email" id="input-email" placeholder="Digite seu e-mail">
        </div>
        <div class="campo-form">
          <label for="input-senha">Senha</label>
          <input type="password" id="input-senha" placeholder="Digite sua senha">
        </div>
        <div id="erro-login" class="mensagem-erro"></div>
        <div class="acoes-modal">
          <button type="button" id="btn-cancelar-modal" class="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-submeter">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Rodapé -->
  <footer>
    <div class="conteudo-footer">
      <div>SAEPChef</div>
      <div class="redes-sociais">
        <span>instagram</span>
        <span>tiktok</span>
        <span>linkedin</span>
        <span>youtube</span>
      </div>
      <div>Copyright 2020-2027</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
